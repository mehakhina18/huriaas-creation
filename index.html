
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Huriaa's Creations</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f7f7f7;
}

.logo{
text-align:center;
padding:10px;
background:#fff;
font-weight:bold;
}

.categories{
display:flex;
gap:10px;
padding:10px;
background:#fff;
overflow-x:auto;
}

.categories div{
min-width:80px;
padding:10px;
border:1px solid black;
text-align:center;
cursor:pointer;
}

/* 🔥 GRID FIX */
.products{
display:grid;
grid-template-columns: 1fr 1fr;
gap:10px;
padding:10px;
}

/* 🔥 CARD FIX */
.card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* 🔥 IMAGE FIX */
.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

.btn{
display:block;
background:black;
color:white;
padding:8px;
margin-top:5px;
text-align:center;
cursor:pointer;
}

</style>

<script>
function filter(category){

let cards = document.getElementsByClassName("card");

for(let i=0;i<cards.length;i++){

if(category==="all"){
cards[i].style.display="block";
}
else if(cards[i].classList.contains(category)){
cards[i].style.display="block";
}
else{
cards[i].style.display="none";
}

}
}
</script>

</head>

<body>

<div class="logo">Huriaa's Creations</div>

<div class="categories">
<div onclick="filter('all')">All</div>
<div onclick="filter('women')">Women</div>
<div onclick="filter('men')">Men</div>
</div>

<!-- 🔥 IMPORTANT WRAPPER -->
<div class="products">

<div class="card women">
<img src="product1.jpg">
<h3>Chocolate Bouquet</h3>
<p>Rs 12000</p>
<div class="btn">Order</div>
</div>

<div class="card women">
<img src="product2.jpg">
<h3>Makeup Bouquet</h3>
<p>Rs 7000</p>
<div class="btn">Order</div>
</div>

<div class="card men">
<img src="product3.jpg">
<h3>Gift Box</h3>
<p>Rs 10000</p>
<div class="btn">Order</div>
</div>

<div class="card men">
<img src="product4.jpg">
<h3>Perfume Set</h3>
<p>Rs 5000</p>
<div class="btn">Order</div>
</div>

</div>

</body>
</html>
