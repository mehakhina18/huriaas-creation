<script>
const products = [
  { id:"p1", name:"Chocolate Bouquet", price:12000, desc:"Perfect Gift", img:"product1.jpg", category:["Women"] },
  { id:"p2", name:"Makeup Bouquet", price:7000, desc:"Beautiful Gift", img:"product2.jpg", category:["Women"] },
  { id:"p3", name:"Watch Gift Box", price:10000, desc:"Luxury Gift", img:"product3.jpg", category:["Men"] }
];

let currentOrder = {};
const WHATSAPP_NUMBER = "923152950176";
const WEBSITE_URL = window.location.href.split('#')[0];

// ---------------- PRODUCTS DISPLAY ----------------
function displayProducts(cat="All"){
  const box = document.getElementById("productList");
  box.innerHTML = "";

  let filtered = (cat === "All")
    ? products
    : products.filter(p => p.category.includes(cat));

  filtered.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x220'">
        <h3>${p.name}</h3>
        <div class="price">Rs. ${p.price.toLocaleString()}</div>
        <p>${p.desc}</p>

        <button class="btn" onclick="orderNow('${p.name}', ${p.price}, '${p.id}')">Order Now</button>

        <button class="btn" style="background:white;color:var(--purple);border:1px solid var(--purple)" 
        onclick="customizeNow('${p.name}', '${p.id}')">
        Customize
        </button>
      </div>
    `;
  });
}

// ---------------- CATEGORY FILTER ----------------
function filterProducts(cat, el){
  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

  el.classList.add("active");
  displayProducts(cat);
}

// ---------------- ORDER SYSTEM (BANK + WHATSAPP) ----------------
function orderNow(name, price, id){
  currentOrder = {
    name,
    price,
    link: WEBSITE_URL + "#" + id
  };

  document.getElementById("orderSummary").innerHTML =
    `<b>Product:</b> ${name}<br><b>Price:</b> Rs ${price}`;

  document.getElementById("bankModal").style.display = "block";
}

// ---------------- CUSTOMIZE (WHATSAPP DIRECT) ----------------
function customizeNow(name, id){
  let msg = `Hello! I want to customize *${name}*%0AProduct Link: ${WEBSITE_URL}#${id}`;

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}

// ---------------- PAYMENT CONFIRM ----------------
function sendToWhatsApp(){
  let msg = `*New Order Paid*%0AProduct: ${currentOrder.name}%0AAmount: Rs ${currentOrder.price}%0ALink: ${currentOrder.link}%0AI have sent payment screenshot.`;

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");

  closeModal();
}

// ---------------- MODAL CLOSE ----------------
function closeModal(){
  document.getElementById("bankModal").style.display = "none";
}

// ---------------- INIT ----------------
window.addEventListener("DOMContentLoaded", function(){
  displayProducts("All");
});
</script>
