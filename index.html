<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<div class="logo">Huriaa's Creations</div>

<style>

body{
margin:0;
font-family:Arial;
background:#fff;
}

header{
background:#7B2CBF;
color:white;
padding:20px;
text-align:center;
}

.categories{
display:flex;
justify-content:center;
gap:10px;
padding:15px;
background:#F3E8FF;
flex-wrap:wrap;
}

.categories button{
padding:10px 18px;
border:none;
border-radius:20px;
cursor:pointer;
background:white;
font-size:15px;
}
  
.logo{
font-family: 'Great Vibes', cursive;
font-size: 52px;
font-weight: normal;
text-align: center;
padding: 18px;
color: #b57edc;
background: white;
letter-spacing: 2px;
}

.categories button.active{
background:#7B2CBF;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
border:1px solid #ddd;
border-radius:10px;
overflow:hidden;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{
margin:10px;
}

.price{
margin:10px;
color:#7B2CBF;
font-weight:bold;
}

.card p{
margin:10px;
color:gray;
}

.btn{
width:90%;
margin:8px 5%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.order{
background:#7B2CBF;
color:white;
}

.custom{
background:white;
border:1px solid #7B2CBF;
color:#7B2CBF;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.modal-content{
background:white;
width:90%;
max-width:400px;
margin:10% auto;
padding:20px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<div class="logo">Huriaa's Creations</div>
<p>Handmade Gifts ♥</p>
</header>

<div class="categories">

<button class="active" onclick="filterProducts('All',this)">
All
</button>

<button onclick="filterProducts('Women',this)">
Women
</button>

<button onclick="filterProducts('Men',this)">
Men
</button>

<button onclick="filterProducts('Baby Boy',this)">
Baby Boy
</button>

<button onclick="filterProducts('Baby Girl',this)">
Baby Girl
</button>

</div>

<section class="products" id="productList"></section>

<!-- MODAL -->

<div class="modal" id="bankModal">

<div class="modal-content">

<h2>Bank Details</h2>

<p id="orderSummary"></p>

<div style="background:#F3E8FF;padding:10px;border-radius:8px;margin-top:10px;">

<p><b>Bank:</b> Meezan Bank</p>

<p><b>Account Title:</b> Mohsin</p>

<p><b>Account Number:</b> 00300108549036</p>

</div>

<button class="btn order" onclick="sendToWhatsApp()">
I Have Paid - Send Screenshot
</button>

<button class="btn custom" onclick="closeModal()">
Close
</button>

</div>

</div>

<script>

const WHATSAPP = "923152950176";

const products = [

{
name:"Chocolate Bouquet",
price:12000,
desc:"Sweetness Wrapped In Love",
img:"product1.jpg",
category:"Women,Men"
},

{
name:"Makeup Bouquet",
price:8000,
desc:"Perfect Gift For Beauty Lover",
img:"product2.jpg",
category:"Women"
},

{
name:"12 Pair Jhumka Bouqet",
price:7000,
desc:"Perfect Gift For Every Ocassion",
img:"product3.jpg",
category:"Women"
},

{
name:"Premium Gift Box For Him",
price:12000,
desc:"Gift Him Something Truly Special",
img:"product4.jpg",
category:"Men"
},

{
name:"Baby Girl Basket",
price:8000,
desc:"welcome Your Baby Girl With Love",
img:"product5.jpg",
category:"Baby Girl"
},

{
name:"Baby Girl Box",
price:6500,
desc:"welcome Your Baby Girl With Love",
img:"product6.jpg",
category:"Baby Girl"
},

{
name:"Mother's Day Basket",
price:7000,
desc:"Made With Love Just For Mom",
img:"product7.jpg",
category:"Women"
},

{
name:"Hijabi Bouqet",
price:7000,
desc:"A Graceful Gift With A Touch Of Style",
img:"product8.jpg",
category:"Women"
}

];

let currentOrder = {};

function displayProducts(list){

const container = document.getElementById("productList");

container.innerHTML = "";

list.forEach((p)=>{

container.innerHTML += `

<div class="card">

<img src="${p.img}">

<h3>${p.name}</h3>

<div class="price">
Rs ${p.price}
</div>

<p>${p.desc}</p>

<button class="btn order"
onclick="orderNow('${p.name}',${p.price})">

Order Now

</button>

<button class="btn custom"
onclick="customizeNow('${p.name}')">

Customize

</button>

</div>

`;

});

}

function filterProducts(category,btn){

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(category==="All"){

displayProducts(products);

}
else{

const filtered = products.filter(
p => p.category === category
);

displayProducts(filtered);

}

}

function orderNow(name,price){

currentOrder = {
name:name,
price:price
};

document.getElementById("orderSummary").innerHTML =
"<b>Product:</b> " + name +
"<br><b>Price:</b> Rs " + price;

document.getElementById("bankModal").style.display = "block";

}

function customizeNow(name){

let msg =
"Hello! I want to customize " + name;

window.open(
"https://wa.me/" + WHATSAPP +
"?text=" + encodeURIComponent(msg),
"_blank"
);

}

function sendToWhatsApp(){

let msg =
"Paid Order%0AProduct: " +
currentOrder.name +
"%0APrice: Rs " +
currentOrder.price +
"%0AI have sent payment screenshot.";

window.open(
"https://wa.me/" + WHATSAPP +
"?text=" + msg,
"_blank"
);

closeModal();

}

function closeModal(){

document.getElementById("bankModal").style.display =
"none";

}

displayProducts(products);

</script>

</body>
</html>
