/* CATEGORIES */

padding:15px;
background:#F3E8FF;

}

.categories button{
padding:10px 18px;

}

background:#7B2CBF;
color:white;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
border:1px solid #ddd;
border-radius:10px;
overflow:hidden;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.card img{
width:100%;
height:250px;
object-fit:contain;
background:white;
}

.card h3{
margin:10px;
}

.price{
margin:10px;
color:#7B2CBF;
font-weight:bold;
}

.card p{
margin:10px;
color:gray;
}

.btn{
width:90%;
margin:8px 5%;
padding:10px;
border-radius:8px;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

/* ORDER BUTTON */
.order{
background:transparent;
color:#7B2CBF;
border:2px solid #7B2CBF;
}

.order:hover{
background:#7B2CBF;
color:white;
}

/* CUSTOM BUTTON */
.custom{
background:white;
border:1px solid #7B2CBF;

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.modal-content{

width:90%;
max-width:400px;

padding:20px;

let currentOrder = {};

function displayProducts(list){

const container = document.getElementById("productList");

container.innerHTML = "";

list.forEach(p=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<img src="${p.img}">

<h3>${p.name}</h3>

<div class="price">
Rs ${p.price.toLocaleString()}
</div>

<p>${p.desc}</p>

<button class="btn order">
Order Now
</button>

<button class="btn custom">
Customize
</button>
`;

card.querySelector(".order").onclick = () =>
orderNow(p.name,p.price);

card.querySelector(".custom").onclick = () =>
customizeNow(p.name);

container.appendChild(card);

});

}

function filterProducts(category,btn){

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(category==="All"){
displayProducts(products);
return;
}

const filtered = products.filter(p=>{

const cats = p.category.split(",");

return cats.includes(category);

});

displayProducts(filtered);

}

function orderNow(name,price){

currentOrder = {name,price};

document.getElementById("orderSummary").innerHTML =
"<b>Product:</b> " + name +
"<br><b>Price:</b> Rs " + price.toLocaleString();

document.getElementById("bankModal").style.display =
"block";

}

function customizeNow(name){

let msg =
"Hello! I want to customize " + name;

window.open(
"https://wa.me/" + WHATSAPP +
"?text=" + encodeURIComponent(msg),
"_blank"
);

}

function sendToWhatsApp(){

);

closeModal();

}

function closeModal(){

"none";

}
