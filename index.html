<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huriaa's Creations</title>

<style>

body{
margin:0;
font-family:Arial;
background:#fff;
}

header{
background:#7B2CBF;
color:white;
padding:20px;
text-align:center;
}

.categories{
display:flex;
justify-content:center;
gap:10px;
padding:15px;
background:#F3E8FF;
flex-wrap:wrap;
}

.categories button{
padding:10px 18px;
border:none;
border-radius:20px;
cursor:pointer;
background:white;
}

.categories button.active{
background:#7B2CBF;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
border:1px solid #ddd;
border-radius:10px;
overflow:hidden;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{
margin:10px;
}

.price{
margin:10px;
color:#7B2CBF;
font-weight:bold;
}

.card p{
margin:10px;
color:gray;
}

.btn{
width:90%;
margin:8px 5%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.order{
background:#7B2CBF;
color:white;
}

.custom{
background:white;
border:1px solid #7B2CBF;
color:#7B2CBF;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.modal-content{
background:white;
width:90%;
max-width:400px;
margin:10% auto;
padding:20px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<h1>Huriaa's Creations</h1>
<p>Handmade Gifts ♥</p>
</header>

<div class="categories">
<button class="active" onclick="filterProducts('All',this)">All</button>
<button onclick="filterProducts('Women',this)">Women</button>
<button onclick="filterProducts('Men',this)">Men</button>
</div>

<section class="products" id="productList"></section>

<div class="modal" id="bankModal">
<div class="modal-content">

<h2>Bank Details</h2>

<p id="orderSummary"></p>

<div style="background:#F3E8FF;padding:10px;border-radius:8px;margin-top:10px;">
<p><b>Bank:</b> Meezan Bank</p>
<p><b>Account Title:</b> Mohsin</p>
<p><b>Account Number:</b> 00300108549036</p>
</div>

<button class="btn order" onclick="sendToWhatsApp()">
I Have Paid - Send Screenshot
</button>

<button class="btn custom" onclick="closeModal()">
Close
</button>

</div>
</div>

<script>

const WHATSAPP = "923152950176";

const products = [

{
name:"Chocolate Bouquet",
price:12000,
desc:"Sweetness Wrapped In Love",
img:"https://via.placeholder.com/300x200?text=Chocolate+Bouquet",
category:"Women"
},

{
name:"Makeup Bouquet",
price:8000,
desc:"Beauty Gift",
img:"https://via.placeholder.com/300x200?text=Makeup+Bouquet",
category:"Women"
},

{
name:"Premium Gift Box",
price:10000,
desc:"Luxury Gift For Him",
img:"https://via.placeholder.com/300x200?text=Gift+Box",
category:"Men"
},

{
name:"Watch Box",
price:7000,
desc:"Special Men's Gift",
img:"https://via.placeholder.com/300x200?text=Watch+Box",
category:"Men"
}

];

let currentOrder = {};

function displayProducts(list){

const container = document.getElementById("productList");

container.innerHTML = "";

list.forEach((p)=>{

container.innerHTML += `

<div class="card">

<img src="${p.img}">

<h3>${p.name}</h3>

<div class="price">Rs ${p.price}</div>

<p>${p.desc}</p>

<button class="btn order"
onclick="orderNow('${p.name}',${p.price})">
Order Now
</button>

<button class="btn custom"
onclick="customizeNow('${p.name}')">
Customize
</button>

</div>

`;

});

}

function filterProducts(category,btn){

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(category==="All"){
displayProducts(products);
}
else{
const filtered = products.filter(
p => p.category === category
);

displayProducts(filtered);
}

}

function orderNow(name,price){

currentOrder = {
name:name,
price:price
};

document.getElementById("orderSummary").innerHTML =
"<b>Product:</b> " + name +
"<br><b>Price:</b> Rs " + price;

document.getElementById("bankModal").style.display = "block";

}

function customizeNow(name){

let msg = "Hello! I want to customize " + name;

window.open(
"https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg),
"_blank"
);

}

function sendToWhatsApp(){

let msg =
"Paid Order%0AProduct: " +
currentOrder.name +
"%0APrice: Rs " +
currentOrder.price;

window.open(
"https://wa.me/" + WHATSAPP + "?text=" + msg,
"_blank"
);

closeModal();

}

function closeModal(){
document.getElementById("bankModal").style.display = "none";
}

displayProducts(products);

</script>

</body>
</html>
